<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1e40af">
<title>МедКалькулятор</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<style>
  * { box-sizing: border-box; font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: #f5f7fa; color: #1a2634; min-height: 100vh; padding: 16px; display: flex; justify-content: center; }
  .app { max-width: 480px; width: 100%; }
  .header { background: #1e40af; color: white; padding: 16px; margin: -16px -16px 16px -16px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 10; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  .header .logo { width: 36px; height: 36px; background: white; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden; }
  .header .logo img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .header .title-block { flex: 1; min-width: 0; }
  .header h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; color: white; margin: 0; }
  .header p { color: rgba(255,255,255,0.75); font-size: 12px; margin-top: 2px; }
  .header .menu-btn { background: none; border: none; font-size: 24px; cursor: pointer; padding: 4px 8px; color: white; line-height: 1; flex-shrink: 0; }
  .header .info-btn { background: none; border: none; font-size: 18px; cursor: pointer; padding: 0 4px; color: rgba(255,255,255,0.8); vertical-align: super; }
  .search { width: 100%; padding: 14px 16px; border: 1.5px solid #e2e8f0; border-radius: 16px; font-size: 16px; margin-bottom: 16px; outline: none; background: white; }
  .search:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
  .card { background: white; border-radius: 20px; padding: 18px; margin-bottom: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.04); cursor: pointer; transition: 0.15s; border: 1.5px solid transparent; position: relative; }
  .card:hover { border-color: #3b82f6; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(59,130,246,0.12); }
  .card:active { transform: scale(0.99); }
  .card .name { font-size: 17px; font-weight: 600; margin-bottom: 4px; padding-right: 36px; }
  .card .meta { font-size: 13px; color: #6b7a8a; display: flex; gap: 8px; align-items: center; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 8px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; }
  .badge.formula { background: #dbeafe; color: #1e40af; }
  .badge.questionnaire { background: #fce7f3; color: #9d174d; }
  .star { position: absolute; top: 14px; right: 14px; background: none; border: none; font-size: 22px; cursor: pointer; color: #cbd5e1; padding: 4px; line-height: 1; transition: 0.15s; }
  .star:hover { color: #f59e0b; transform: scale(1.1); }
  .star.active { color: #f59e0b; }
  .section-title { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #6b7a8a; margin: 20px 4px 10px; }
  .back { background: none; border: none; font-size: 15px; color: #3b82f6; cursor: pointer; padding: 8px 0; margin-bottom: 8px; font-weight: 500; }
  .page-title { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  .page-sub { font-size: 14px; color: #6b7a8a; margin-bottom: 20px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 14px; font-weight: 500; color: #34495e; margin-bottom: 6px; }
  .field input { width: 100%; padding: 14px 16px; border: 1.5px solid #e2e8f0; border-radius: 14px; font-size: 16px; outline: none; background: white; transition: 0.15s; }
  .field input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
  .field .radio-group, .field .select-group { display: flex; gap: 8px; flex-wrap: wrap; }
  .field .radio-btn { flex: 1; min-width: 100px; padding: 14px 16px; border: 1.5px solid #e2e8f0; border-radius: 14px; background: white; font-size: 15px; text-align: center; cursor: pointer; transition: 0.12s; font-weight: 500; color: #4a5a6a; }
  .field .radio-btn:hover { border-color: #cbd5e1; }
  .field .radio-btn.active { background: #1a2634; color: white; border-color: #1a2634; font-weight: 600; }
  .question { background: white; border-radius: 14px; padding: 14px 16px; margin-bottom: 8px; }
  .question .qtext { font-size: 15px; margin-bottom: 10px; line-height: 1.35; }
  .options { display: flex; flex-wrap: wrap; gap: 6px; }
  .opt { flex: 1 1 auto; min-width: 60px; padding: 10px 8px; border: 1.5px solid #e2e8f0; border-radius: 10px; background: white; font-size: 13px; text-align: center; cursor: pointer; transition: 0.12s; font-weight: 500; color: #4a5a6a; }
  .opt:hover { border-color: #cbd5e1; }
  .opt.active { background: #1a2634; color: white; border-color: #1a2634; font-weight: 600; }

  .q-check { display: flex; align-items: flex-start; gap: 12px; cursor: pointer; padding: 12px 14px; background: white; border-radius: 14px; margin-bottom: 8px; border: 1.5px solid transparent; transition: 0.12s; user-select: none; }
  .q-check:hover { border-color: #cbd5e1; }
  .q-check.on { border-color: #1a2634; background: #f8fafc; }
  .q-check.auto { border-color: #3b82f6; background: #eff6ff; cursor: not-allowed; }
  .q-check.auto .box { background: #3b82f6; border-color: #3b82f6; }
  .q-check.auto .pts { color: #1e40af; }
  .q-check .box { flex-shrink: 0; width: 24px; height: 24px; border: 2px solid #cbd5e1; border-radius: 8px; display: flex; align-items: center; justify-content: center; transition: 0.12s; background: white; margin-top: 1px; }
  .q-check.on .box { background: #1a2634; border-color: #1a2634; }
  .q-check .box svg { opacity: 0; transition: 0.12s; }
  .q-check.on .box svg { opacity: 1; }
  .q-check .qtext { font-size: 15px; line-height: 1.35; flex: 1; }
  .q-check .pts { font-size: 12px; color: #6b7a8a; font-weight: 600; white-space: nowrap; margin-top: 2px; }
  .q-check.on .pts { color: #1a2634; }
  .q-check .auto-tag { font-size: 10px; font-weight: 700; color: #1e40af; background: #dbeafe; padding: 2px 6px; border-radius: 6px; margin-left: 6px; text-transform: uppercase; letter-spacing: 0.3px; }

  .pre-block { background: white; border-radius: 16px; padding: 14px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
  .pre-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .pre-fields .field { margin-bottom: 0; }
  .pre-fields .field.full { grid-column: 1 / -1; }
  .calc-line { margin-top: 10px; padding-top: 10px; border-top: 1px dashed #e2e8f0; display: flex; justify-content: space-between; align-items: baseline; }
  .calc-line .cl-label { font-size: 13px; color: #6b7a8a; font-weight: 500; }
  .calc-line .cl-value { font-size: 18px; font-weight: 700; color: #1a2634; }
  .calc-line .cl-value .unit { font-size: 13px; color: #6b7a8a; font-weight: 500; margin-left: 3px; }
  .calc-line.in-total .cl-value { color: #1e40af; }
  .calc-line.in-total .cl-label::after { content: " · в сумме"; color: #3b82f6; font-size: 11px; font-weight: 600; }

  .progress-bar { font-size: 13px; color: #6b7a8a; margin-bottom: 12px; padding: 8px 4px; display: flex; justify-content: space-between; align-items: center; }
  .progress-bar b { color: #1a2634; }

  .btn { width: 100%; background: #1a2634; color: white; border: none; padding: 16px; border-radius: 40px; font-size: 17px; font-weight: 600; cursor: pointer; transition: 0.15s; margin-top: 12px; }
  .btn:active { transform: scale(0.98); background: #2d3b4a; }
  .btn:disabled { background: #cbd5e1; cursor: not-allowed; }
  .result { margin-top: 20px; background: white; border-radius: 20px; padding: 24px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
  .result .value { font-size: 40px; font-weight: 800; line-height: 1; letter-spacing: -1px; }
  .result .unit { font-size: 18px; color: #6b7a8a; font-weight: 500; margin-left: 4px; }
  .result .interp { font-size: 15px; font-weight: 500; margin-top: 12px; padding: 10px 16px; border-radius: 12px; display: inline-block; line-height: 1.4; text-align: left; }
  .result .source { font-size: 12px; color: #94a3b8; margin-top: 14px; }
  .result .breakdown { font-size: 13px; color: #6b7a8a; margin-top: 12px; padding: 10px; background: #f8fafc; border-radius: 10px; text-align: left; }
  .result .breakdown div { display: flex; justify-content: space-between; padding: 3px 0; }
  .result .breakdown .b-total { border-top: 1px solid #e2e8f0; margin-top: 6px; padding-top: 6px; font-weight: 700; color: #1a2634; }
  .hidden { display: none !important; }
  .loading { text-align: center; color: #6b7a8a; padding: 40px 0; }
  .error-box { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; padding: 16px; border-radius: 14px; font-size: 14px; margin-top: 20px; }
</style>
</head>
<body>
<div class="app">
  <div id="app"></div>
</div>

<script>
// ---------- Состояние ----------
let DATA = null;
let currentCalc = null;
let answers = {};
let formValues = {};
let calcVars = {};
let favorites = JSON.parse(localStorage.getItem('medcalc_favorites') || '[]');

// ---------- Избранное ----------
function toggleFavorite(id, event) {
  event.stopPropagation();
  const idx = favorites.indexOf(id);
  if (idx === -1) favorites.push(id);
  else favorites.splice(idx, 1);
  localStorage.setItem('medcalc_favorites', JSON.stringify(favorites));
  renderList(document.getElementById('search')?.value || '');
}

// ---------- Загрузка данных ----------
async function loadData() {
  try {
    const res = await fetch('formulas.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('Не удалось загрузить formulas.json');
    DATA = await res.json();
    renderList();
  } catch (e) {
    document.getElementById('app').innerHTML = `
      <div class="error-box">
        <b>Ошибка загрузки данных</b><br>
        ${e.message}<br><br>
        Убедитесь, что файл <code>formulas.json</code> лежит в той же папке, и вы открываете страницу через Live Server, а не двойным кликом.
      </div>`;
  }
}

// ---------- Рендер карточки ----------
function cardHTML(c) {
  const badgeClass = c.type === 'formula' ? 'formula' : 'questionnaire';
  const badgeText = c.type === 'formula' ? 'Формула' : 'Опросник';
  const isFav = favorites.includes(c.id);
  return `
    <div class="card" onclick="openCalc('${c.id}')">
      <button class="star ${isFav ? 'active' : ''}" onclick="toggleFavorite('${c.id}', event)">${isFav ? '★' : '☆'}</button>
      <div class="name">${c.name}</div>
      <div class="meta">
        <span class="badge ${badgeClass}">${badgeText}</span>
        <span>${c.specialty || ''}</span>
      </div>
    </div>`;
}

// ---------- Экран списка ----------
function renderList(filter = '') {
  const f = filter.toLowerCase().trim();
  const matches = c =>
    !f || c.name.toLowerCase().includes(f) ||
    (c.specialty || '').toLowerCase().includes(f) ||
    (c.description || '').toLowerCase().includes(f);

  const favItems = DATA.calculators.filter(c => favorites.includes(c.id) && matches(c));
  const otherItems = DATA.calculators.filter(c => !favorites.includes(c.id) && matches(c));

  let html = `
      <div class="header">
        <div class="logo"><img src="icon-192.png" alt=""></div>
        <div class="title-block">
          <h1>МедКалькулятор <span onclick="showDisclaimer()" class="info-btn">ⓘ</span></h1>
          <p>v${DATA.version} · ${DATA.calculators.length} инструментов</p>
        </div>
        <button class="menu-btn" onclick="toggleMenu()">⋮</button>
      </div>
    <input class="search" id="search" placeholder="Поиск по названию или специальности..." value="${filter}">
  `;

  if (favItems.length > 0) {
    html += `<div class="section-title">★ Избранное</div>`;
    favItems.forEach(c => { html += cardHTML(c); });
  }

  if (otherItems.length > 0) {
    if (favItems.length > 0) html += `<div class="section-title">Все инструменты</div>`;
    otherItems.forEach(c => { html += cardHTML(c); });
  }

  if (favItems.length === 0 && otherItems.length === 0) {
    html += `<div class="loading">Ничего не найдено</div>`;
  }

  document.getElementById('app').innerHTML = html;
  const searchEl = document.getElementById('search');
  if (searchEl) {
    searchEl.addEventListener('input', e => renderList(e.target.value));
    if (filter) { searchEl.focus(); searchEl.setSelectionRange(filter.length, filter.length); }
  }
}

// ---------- Открытие калькулятора ----------
function openCalc(id) {
  currentCalc = DATA.calculators.find(c => c.id === id);
  answers = {};
  formValues = {};
  calcVars = {};
  if (currentCalc.type === 'formula') renderFormula();
  else renderQuestionnaire();
}

// ---------- Экран формулы ----------
function renderFormula() {
  const c = currentCalc;
  let html = `
    <button class="back" onclick="renderList()">← Назад</button>
    <div class="page-title">${c.name}</div>
    <div class="page-sub">${c.description || ''}</div>
  `;
  c.fields.forEach(f => {
    html += `<div class="field"><label>${f.label}</label>`;
    if (f.type === 'select' || f.type === 'radio') {
      html += `<div class="${f.type === 'select' ? 'select-group' : 'radio-group'}" data-field="${f.id}">`;
      f.options.forEach(o => {
        html += `<button class="radio-btn" data-field="${f.id}" data-value="${o.value}" onclick="selectField(this)">${o.label}</button>`;
      });
      html += `</div>`;
    } else if (f.type === 'date') {
      html += `<input type="date" id="f_${f.id}">`;
    } else {
      html += `<input type="number" id="f_${f.id}" placeholder="${f.placeholder || ''}" step="${f.step || 'any'}" inputmode="decimal">`;
    }
    html += `</div>`;
  });
  html += `<button class="btn" id="calcBtn">Рассчитать</button>`;
  html += `<div id="resultZone"></div>`;
  document.getElementById('app').innerHTML = html;

  document.getElementById('calcBtn').addEventListener('click', calcFormula);
}

function selectField(btn) {
  const fieldId = btn.dataset.field;
  const value = btn.dataset.value;
  formValues[fieldId] = value;
  btn.parentElement.querySelectorAll('.radio-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

// ---------- Интерпретация ----------
function pickInterpretation(interpList, mode, value, vars) {
  if (!interpList || interpList.length === 0) return null;

  for (const item of interpList) {
    if (item.if) {
      let condOk = false;
      try {
        const keys = Object.keys(vars);
        const fn = new Function('value', ...keys, `return (${item.if});`);
        condOk = !!fn(value, ...keys.map(k => vars[k]));
      } catch (e) {
        console.warn('Ошибка в условии if:', item.if, e);
        condOk = false;
      }
      if (!condOk) continue;
      if (item.min === undefined || item.max === undefined) return item;
    }

    if (item.min === undefined || item.max === undefined) {
      if (mode === 'logic') continue;
      continue;
    }

    if (value >= item.min && value < item.max) return item;
  }
  return null;
}

function calcFormula() {
  const c = currentCalc;
  const vals = {};
  let valid = true;
  c.fields.forEach(f => {
    if (f.type === 'select' || f.type === 'radio') {
      if (formValues[f.id] === undefined) valid = false;
      else vals[f.id] = parseFloat(formValues[f.id]);
    } else if (f.type === 'date') {
      const el = document.getElementById(`f_${f.id}`);
      if (!el.value) valid = false;
      else vals[f.id] = el.value;
    } else {
      const v = parseFloat(document.getElementById(`f_${f.id}`).value);
      if (isNaN(v)) valid = false;
      vals[f.id] = v;
    }
  });
  const zone = document.getElementById('resultZone');
  if (!valid) {
    zone.innerHTML = `<div class="error-box">Заполните все поля</div>`;
    return;
  }

  let result;
  try {
    const keys = Object.keys(vals);
    const values = keys.map(k => vals[k]);

    let fn;
    try {
      fn = new Function('Math', ...keys, `return (${c.formula});`);
      result = fn(Math, ...values);
    } catch (e) {
      fn = new Function('Math', ...keys, c.formula);
      result = fn(Math, ...values);
    }
  } catch (e) {
    zone.innerHTML = `<div class="error-box">Ошибка в формуле: ${e.message}</div>`;
    return;
  }

  if (typeof result === 'number' && !isFinite(result)) {
    zone.innerHTML = `<div class="error-box">Проверьте введённые данные</div>`;
    return;
  }

  const decimals = c.decimals !== undefined ? c.decimals : 1;
  const display = typeof result === 'number' ? result.toFixed(decimals) : result;

  let interp = null;
  if (typeof result === 'number') {
    interp = pickInterpretation(c.interpretation, c.interpretationMode, result, vals);
  }

  const color = interp ? interp.color : '#1a2634';
  const label = interp ? interp.label : (typeof result === 'string' ? '' : '—');

  zone.innerHTML = `
    <div class="result">
      <div class="value" style="color:${color}">${display}<span class="unit">${c.unit || ''}</span></div>
            ${label ? `<div class="interp" style="background:${color}22; color:${color}">${label}</div>` : ''}
      ${c.source ? `<div class="source">Источник: ${c.source}</div>` : ''}
    </div>`;
}

// ================================================================
//                        ОПРОСНИК
// ================================================================

function renderQuestionnaire() {
  const c = currentCalc;
  const hasChecks = c.questions.some(q => q.type === 'check');
  const hasPre = c.preFields && c.preFields.length > 0;
  const hasCalc = c.calc && c.calc.length > 0;

  let html = `
    <button class="back" onclick="renderList()">← Назад</button>
    <div class="page-title">${c.name}</div>
    <div class="page-sub">${c.description || ''}</div>
  `;

  // --- Pre-fields + calc ---
  if (hasPre) {
    html += `<div class="pre-block"><div class="pre-fields">`;
    c.preFields.forEach(f => {
      const full = f.type === 'radio' || f.type === 'select' ? ' full' : '';
      html += `<div class="field${full}"><label>${f.label}</label>`;
      if (f.type === 'radio' || f.type === 'select') {
        html += `<div class="radio-group" data-field="${f.id}">`;
        f.options.forEach(o => {
          html += `<button class="radio-btn" data-field="${f.id}" data-value="${o.value}" onclick="selectPreField(this)">${o.label}</button>`;
        });
        html += `</div>`;
      } else if (f.type === 'date') {
        html += `<input type="date" id="p_${f.id}" oninput="onPreInput()">`;
      } else {
        html += `<input type="number" id="p_${f.id}" placeholder="${f.placeholder || ''}" step="${f.step || 'any'}" inputmode="decimal" oninput="onPreInput()">`;
      }
      html += `</div>`;
    });
    html += `</div>`;

    if (hasCalc) {
      c.calc.forEach(cv => {
        const inTotal = cv.includeInTotal ? ' in-total' : '';
        html += `<div class="calc-line${inTotal}" id="calcLine_${cv.id}" style="display:none;">
          <span class="cl-label">${cv.label || cv.id}</span>
          <span class="cl-value"><span id="calcVal_${cv.id}">—</span><span class="unit">${cv.unit || ''}</span></span>
        </div>`;
      });
    }
    html += `</div>`;
  }

  if (hasChecks) {
    html += `<div class="progress-bar"><span>Отмечено: <b id="progCount">0</b> из <b>${c.questions.length}</b></span><span>Сумма: <b id="progSum">0</b> балл.</span></div>`;
  }

  // --- Вопросы ---
  c.questions.forEach(q => {
    const hideAttr = q.hideIf ? ` data-hideif="${q.hideIf.replace(/"/g, '&quot;')}"` : '';
    if (q.type === 'check') {
      const pts = q.points !== undefined ? q.points : 1;
      const autoTag = q.auto ? `<span class="auto-tag">авто</span>` : '';
      html += `
        <div class="q-check" data-q="${q.id}" data-pts="${pts}" data-auto="${(q.auto || '').replace(/"/g, '&quot;')}"${hideAttr} onclick="toggleCheck(this, event)">
          <div class="box">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <path d="M2 7L6 11L12 3" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="qtext">${q.text} ${autoTag}</div>
          <div class="pts">+${pts}</div>
        </div>`;
    } else {
      const opts = q.options || c.options || [];
      html += `
        <div class="question" data-q="${q.id}"${hideAttr}>
          <div class="qtext">${q.text}</div>
          <div class="options">
            ${opts.map(o => `<button class="opt" data-q="${q.id}" data-v="${o.value}" onclick="selectOpt(this)">${o.label}</button>`).join('')}
          </div>
        </div>`;
    }
  });

  html += `<button class="btn" id="calcBtn">Посчитать результат</button>`;
  html += `<div id="resultZone"></div>`;
  document.getElementById('app').innerHTML = html;

  document.getElementById('calcBtn').addEventListener('click', calcQuestionnaire);

  applyHideIf();
  recalcAutoChecks();
  updateProgress();
}

function selectPreField(btn) {
  const fieldId = btn.dataset.field;
  formValues[fieldId] = btn.dataset.value;
  btn.parentElement.querySelectorAll('.radio-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  onPreInput();
}

function collectPreFields() {
  const c = currentCalc;
  if (!c.preFields) return;
  c.preFields.forEach(f => {
    if (f.type === 'radio' || f.type === 'select') return;
    const el = document.getElementById(`p_${f.id}`);
    if (!el) return;
    if (f.type === 'date') formValues[f.id] = el.value;
    else {
      const v = parseFloat(el.value);
      formValues[f.id] = isNaN(v) ? undefined : v;
    }
  });
}

function onPreInput() {
  const c = currentCalc;
  if (!c.preFields) return;

  collectPreFields();
  calcVars = {};

  if (c.calc) {
    c.calc.forEach(cv => {
      const lineEl = document.getElementById(`calcLine_${cv.id}`);
      const valEl = document.getElementById(`calcVal_${cv.id}`);
      const varsForCalc = { ...formValues, ...calcVars };

      let allSet = true;
      Object.values(varsForCalc).forEach(v => { if (v === undefined || v === '') allSet = false; });

      if (!allSet) {
        if (lineEl) lineEl.style.display = 'none';
        return;
      }

      try {
        const keys = Object.keys(varsForCalc);
        const values = keys.map(k => varsForCalc[k]);
        let fn;
        let res;
        try {
          fn = new Function('Math', ...keys, `return (${cv.formula});`);
          res = fn(Math, ...values);
        } catch (e) {
          fn = new Function('Math', ...keys, cv.formula);
          res = fn(Math, ...values);
        }
        if (typeof res === 'number' && isFinite(res)) {
          calcVars[cv.id] = res;
          if (lineEl && valEl) {
            lineEl.style.display = 'flex';
            valEl.textContent = res.toFixed(cv.decimals !== undefined ? cv.decimals : 1);
          }
        } else {
          if (lineEl) lineEl.style.display = 'none';
        }
      } catch (e) {
        if (lineEl) lineEl.style.display = 'none';
      }
    });
  }

  applyHideIf();
  recalcAutoChecks();
  updateProgress();
}

function applyHideIf() {
  const all = document.querySelectorAll('[data-hideif]');
  const varsForHide = { ...formValues, ...calcVars, ...answers };

  all.forEach(el => {
    const expr = el.dataset.hideif;
    const qid = el.dataset.q;
    if (!expr) return;

    let hide = false;
    try {
      const keys = Object.keys(varsForHide);
      const fn = new Function(...keys, `return (${expr});`);
      hide = !!fn(...keys.map(k => varsForHide[k]));
    } catch (e) {
      hide = false;
    }

    if (hide) {
      el.classList.add('hidden');
      if (answers[qid] !== undefined) delete answers[qid];
      el.querySelectorAll('.opt.active').forEach(b => b.classList.remove('active'));
      el.querySelectorAll('.q-check.on').forEach(b => { b.classList.remove('on'); });
    } else {
      el.classList.remove('hidden');
    }
  });
}

function recalcAutoChecks() {
  const allChecks = document.querySelectorAll('.q-check');

  allChecks.forEach(el => {
    const qid = el.dataset.q;
    const autoExpr = el.dataset.auto;
    if (!autoExpr) return;
    if (el.classList.contains('hidden')) return;

    const varsForAuto = { ...formValues, ...calcVars, ...answers };
    let autoOn = false;
    try {
      const keys = Object.keys(varsForAuto);
      const fn = new Function(...keys, `return (${autoExpr});`);
      autoOn = !!fn(...keys.map(k => varsForAuto[k]));
    } catch (e) {
      autoOn = false;
    }

    if (autoOn) {
      el.classList.add('on', 'auto');
      answers[qid] = parseInt(el.dataset.pts);
      el.dataset.wasAuto = '1';
    } else {
      el.classList.remove('auto');
      if (el.classList.contains('on') && el.dataset.wasAuto === '1') {
        el.classList.remove('on');
        delete answers[qid];
      }
      el.dataset.wasAuto = '';
    }
  });
}

function toggleCheck(el, event) {
  if (el.classList.contains('auto')) { event.preventDefault(); return; }
  if (el.classList.contains('hidden')) return;
  const qid = el.dataset.q;
  const pts = parseInt(el.dataset.pts);
  if (el.classList.contains('on')) {
    el.classList.remove('on');
    delete answers[qid];
  } else {
    el.classList.add('on');
    answers[qid] = pts;
  }
  recalcAutoChecks();
  updateProgress();
}

function selectOpt(btn) {
  const qid = btn.dataset.q;
  const val = parseInt(btn.dataset.v);
  answers[qid] = val;
  btn.parentElement.querySelectorAll('.opt').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  applyHideIf();
  recalcAutoChecks();
  updateProgress();
}

function updateProgress() {
  const progCount = document.getElementById('progCount');
  const progSum = document.getElementById('progSum');
  if (!progCount) return;
  const totalQ = currentCalc.questions.length;
  const marked = Object.keys(answers).length;
  const sum = Object.values(answers).reduce((a, b) => a + b, 0);
  progCount.textContent = marked;
  progSum.textContent = sum;
}

// --- Расчёт результата опросника ---
function calcQuestionnaire() {
  const c = currentCalc;

  collectPreFields();

  const preValues = {};
  if (c.preFields) {
    c.preFields.forEach(f => {
      if (f.type === 'radio' || f.type === 'select') {
        const v = formValues[f.id];
        preValues[f.id] = v !== undefined ? parseFloat(v) : undefined;
      } else {
        preValues[f.id] = formValues[f.id];
      }
    });
  }

  // --- Сумма ответов (только видимые) ---
  let sumAnswers = 0;
  c.questions.forEach(q => {
    const el = document.querySelector(`[data-q="${q.id}"]`);
    if (el && el.classList.contains('hidden')) return;
    sumAnswers += (answers[q.id] || 0);
  });

  // --- Сумма calc с includeInTotal ---
  let sumCalc = 0;
  const calcBreakdown = [];
  if (c.calc) {
    c.calc.forEach(cv => {
      if (cv.includeInTotal && calcVars[cv.id] !== undefined) {
        const val = calcVars[cv.id];
        sumCalc += val;
        calcBreakdown.push({ label: cv.label || cv.id, value: val, unit: cv.unit || '' });
      }
    });
  }

  const total = sumAnswers + sumCalc;

  const vars = { ...preValues, ...calcVars, ...answers, total };

  const interp = pickInterpretation(c.interpretation, c.interpretationMode, total, vars);
  const color = interp ? interp.color : '#1a2634';
  const label = interp ? interp.label : '—';

  // --- Разбивка (показываем если есть calc с includeInTotal) ---
  let breakdownHTML = '';
  if (calcBreakdown.length > 0) {
    breakdownHTML = `<div class="breakdown">`;
    breakdownHTML += `<div><span>Баллы за ответы:</span><span>${sumAnswers}</span></div>`;
    calcBreakdown.forEach(b => {
      const disp = Number.isInteger(b.value) ? b.value : b.value.toFixed(1);
      breakdownHTML += `<div><span>${b.label}:</span><span>${disp} ${b.unit}</span></div>`;
    });
    breakdownHTML += `<div class="b-total"><span>Итого:</span><span>${total}</span></div>`;
    breakdownHTML += `</div>`;
  }

  document.getElementById('resultZone').innerHTML = `
    <div class="result">
      <div class="value" style="color:${color}">${total}<span class="unit">баллов</span></div>
      <div class="interp" style="background:${color}22; color:${color}">${label}</div>
      ${breakdownHTML}
      ${c.source ? `<div class="source">Источник: ${c.source}</div>` : ''}
    </div>`;
}
